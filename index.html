<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eleitoral</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="screen home-screen" id="inicio">
    <h1 class="home-title"><span>URNA</span> ELEITORAL</h1>
    <nav class="home-actions">
      <a class="big-link" href="#votacao">VOTAR</a>
      <a class="big-link" href="#cadastro">CADASTRO</a>
    </nav>
  </section>

  <section class="screen vote-screen" id="votacao">
    <a class="back-link" href="#inicio">← INÍCIO</a>
    <h1 class="screen-title">URNA</h1>
    <div class="ballot">
      <div class="ballot-photo"><!-- Foto do candidato --></div>
      <div class="ballot-info"><!-- Dados do candidato --></div>
    </div>
    <div class="keypad">
      <div class="number-keys">
        <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
        <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
        <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
        <button class="key zero-key" type="button">0</button>
      </div>
      <div class="vote-actions">
        <button class="action-button white-button" type="button">BRANCO</button>
        <button class="action-button yellow-button" type="button">CORRIGE</button>
        <button class="action-button green-button" type="button">CONFIRMA</button>
      </div>
    </div>
  </section>

  <section class="screen completed-screen" id="voto-concluido">
    <div class="completed-content"><h1>VOTO<br>CONCLUÍDO</h1><div class="checkmark">✓</div></div>
    <a class="back-link" href="#inicio">← INÍCIO</a>
  </section>

  <section class="screen register-screen" id="cadastro">
    <a class="back-link" href="#inicio">← INÍCIO</a>
    <form class="register-card">
      <h1 class="register-title">CADASTRO DO<br>CANDIDATO</h1>
      <input class="register-input" type="text" name="nome" placeholder="NOME" aria-label="Nome do candidato">
      <input class="register-input" type="number" name="numero" placeholder="NÚMERO DO CANDIDATO" aria-label="Número do candidato">
      <div class="photo-area">
        <label class="file-button" for="foto-candidato">ESCOLHER FOTO</label>
        <input class="file-input" id="foto-candidato" type="file" accept="image/*">
      </div>
      <div class="register-submit-area"><button class="submit-button" type="submit">CONCLUIR CADASTRO</button></div>
    </form>
  </section>

  <section class="screen completed-screen" id="cadastro-concluido">
    <div class="completed-content"><h1>CADASTRO<br>CONCLUÍDO</h1><div class="checkmark">✓</div></div>
    <a class="back-link" href="#inicio">← INÍCIO</a>
  </section>
</main>
</body>
</html>
